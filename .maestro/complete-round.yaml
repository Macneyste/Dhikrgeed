appId: app.dhikrgeed
name: Complete a 33/33/34 round
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/open-tasbih.yaml
- runFlow: subflows/tap-33.yaml
- assertVisible: "DIKRI 2 / 3 · 33 / 100"
- runFlow: subflows/tap-33.yaml
- assertVisible: "DIKRI 3 / 3 · 66 / 100"
- runFlow: subflows/tap-33.yaml
- tapOn:
    id: "tap-area"
- assertVisible: "DHAMMAYSTIRAN · 100 / 100"
- assertVisible: "Taqabbal Allaahu minnaa wa minkum"
# Counting has stopped.
- tapOn:
    id: "tap-area"
- assertVisible: "DHAMMAYSTIRAN · 100 / 100"
- tapOn: "Wareeg cusub"
- assertVisible: "DIKRI 1 / 3 · 0 / 100"
